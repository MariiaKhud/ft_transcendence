# It checks:

# ✅ Backend dependencies install.
# ✅ Frontend dependencies install.
# ✅ Prisma client generation.
# ✅ TypeScript compilation.
# ✅ Backend build.
# ✅ Frontend build.
# ✅ Docker images build.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      ###############################
      # Backend
      ###############################

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://transcendence:transcendence@localhost:5432/transcendence
        run: npx prisma generate

      - name: Backend type check
        working-directory: backend
        run: npm run type-check

      - name: Build backend
        working-directory: backend
        run: npm run build

      ###############################
      # Frontend
      ###############################

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI .env
        run: |
          cat <<EOF > .env
          POSTGRES_DB=transcendence
          POSTGRES_USER=transcendence
          POSTGRES_PASSWORD=transcendence
          DATABASE_URL=postgresql://transcendence:transcendence@postgres:5432/transcendence
          JWT_SECRET=ci-secret
          NODE_ENV=production
          BACKEND_PORT=3000
          FRONTEND_PORT=5173
          NGINX_HTTP_PORT=8080
          NGINX_HTTPS_PORT=8443
          VITE_BACKEND_URL=/api
          VITE_DEV_API_PROXY_TARGET=http://backend:3000
          UPLOAD_PATH=./uploads
          EOF

      - name: Build Docker images
        run: docker compose build
